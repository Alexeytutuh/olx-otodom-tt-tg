# /opt/tiktok-connect/docker-compose.yml
services:
  tiktok-connect:
    build: .
    image: tiktok-connect:local
    container_name: tiktok-connect
    restart: unless-stopped
    env_file:
      - /opt/tiktok-connect/.env
    environment:
      DATA_DIR: /data
      PORT: "8090"
      DISPLAY_TZ: Europe/Warsaw
    volumes:
      - ./data:/data
    networks:
      - n8n_default
    # no published ports: Caddy (same docker network) proxies to tiktok-connect:8090
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=4).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  n8n_default:
    external: true
